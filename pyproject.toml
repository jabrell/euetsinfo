[project]
name = "eutl-scraper-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "boto3>=1.43.31",
    "dotenv>=0.9.9",
    "frictionless>=5.18.1",
    "googlemaps>=4.10.0",
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "notebook>=7.4.7",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "python-calamine>=0.6.2",
    "tqdm>=4.67.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.19.0",
    "pre-commit>=4.4.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["main_dev*"]

[tool.ruff.lint]
# Select rules for PEP8 and import sorting
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
]
ignore = []
# Prevent ruff from deleting unused imports on save
unfixable = ["F401"]
