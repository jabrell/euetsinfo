name: accounts
title: EU ETS Accounts
description: >-
  Information about the accounts that are part of the European Union Emissions
  Trading System (EU ETS).
sources:
  - title: European Commission, EUTL database
    path: https://union-registry-data.ec.europa.eu/report/welcome

schema:
  primaryKey: id
  missingValues:
    - ""
    - "NA"
  fields:
    - name: id
      title: Account ID
      description: Unique identifier for the account.
      type: string
      constraints:
        required: true
    - name: name
      title: Account Name
      description: Name of the account.
      type: string
      constraints:
        required: true
    - name: account_type
      title: Account Type
      description: Type of the account.
      type: string
    - name: opening_date
      title: Opening Date
      description: Date the account was opened.
      type: datetime
    - name: closing_date
      title: Closing Date
      description: Date the account was closed.
      type: datetime
    - name: is_closure_pending
      title: Closure Pending
      description: Whether the account has a pending closure.
      type: boolean
    - name: snapshot_date
      title: Snapshot Date
      description: Date of the data snapshot as provided by the EUTL.
      type: datetime
      constraints:
        required: true
    - name: created_at
      title: Date when the data was created
      description: Date when data have been downloaded and processed
      type: datetime
      constraints:
        required: true
