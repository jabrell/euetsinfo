name: account_holders
title: EU ETS AccountHolders
description: >-
  Information about the account holders that are part of the European Union
  Emissions Trading System (EU ETS). Account holders are the legal entities that
  hold accounts in the EU ETS and are responsible for the operation of the
  accounts. Note that account holders can hold multiple accounts. Account holders
  are derived from data in the accounts and transactions table and are not
  directly available in the EUTL database.
sources:
  - title: European Commission, EUTL database
    path: https://union-registry-data.ec.europa.eu/report/welcome

schema:
  primaryKey: id
  missingValues:
    - ""
    - "NA"
  fields:
    - name: id
      title: Account Holder ID
      description: Stable hash-based identifier derived from the account holder name
        and company registration number.
      type: string
      constraints:
        required: true
    - name: name
      title: Account Holder Name
      description: Name of the account holder.
      type: string
      constraints:
        required: true
    - name: company_registration_number
      title: Company Registration Number
      description: Company registration number of the account holder.
      type: string
    - name: legal_entity_identifier
      title: Legal Entity Identifier
      description: Legal Entity Identifier (LEI) of the account holder.
      type: string
    - name: address_main
      title: Address Line 1
      description: Primary address of the account holder.
      type: string
    - name: city
      title: City
      description: City of the account holder.
      type: string
    - name: registry_id
      title: Country
      description: Country of the account holder.
      type: string
    - name: registry_name
      title: Country Name
      description: Name of the national registry where the account is registered.
      type: string
    - name: created_at
      title: Date when the data was created
      description: Date when data have been downloaded and processed
      type: datetime
      constraints:
        required: true
