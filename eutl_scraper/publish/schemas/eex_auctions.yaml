name: eex_auctions
title: EEX Auction Data
description: >-
  Data on auctions of emission allowances on the European Energy Exchange (EEX).
sources:
  - title: European Energy Exchange (EEX)
    path: https://www.eex.com/en/market-data/market-data-hub/environmentals/eex-eua-primary-auction-spot-download

schema:
  primaryKey:
    - auction_name
    - date
    - contract
  missingValues:
    - ""
    - "NA"
  fields:
    - name: auction_name
      title: Auction Name
      description: Name of the auction event.
      type: string
      constraints:
        required: true
    - name: auction_price_eur_per_tco2
      title: Auction Price (EUR/tCO2)
      description: Clearing price of the auction in EUR per tonne of CO2.
      type: number
    - name: auction_volume_tco2
      title: Auction Volume (tCO2)
      description: Total volume auctioned in tonnes of CO2.
      type: integer
      constraints:
        required: true
    - name: average_bid_size
      title: Average Bid Size
      description: Average size of bids submitted.
      type: number
    - name: average_bids_per_bidder
      title: Average Bids per Bidder
      description: Average number of bids submitted per bidder.
      type: number
    - name: average_volume_bid_per_bidder
      title: Average Volume Bid per Bidder
      description: Average volume bid per bidder.
      type: number
    - name: average_volume_won_per_bidder
      title: Average Volume Won per Bidder
      description: Average volume won per bidder.
      type: number
    - name: contract
      title: Contract
      description: Contract type of the auction.
      type: string
      constraints:
        required: true
    - name: country
      title: Country
      description: Country conducting the auction.
      type: string
    - name: cover_ratio
      title: Cover Ratio
      description: Ratio of total bids to volume auctioned.
      type: number
    - name: date
      title: Date
      description: Date of the auction.
      type: datetime
      constraints:
        required: true
    - name: maximum_bid_eur_per_tco2
      title: Maximum Bid (EUR/tCO2)
      description: Highest bid price in EUR per tonne of CO2.
      type: number
    - name: mean_price_eur_per_tco2
      title: Mean Price (EUR/tCO2)
      description: Mean bid price in EUR per tonne of CO2.
      type: number
    - name: median_price_eur_per_tco2
      title: Median Price (EUR/tCO2)
      description: Median bid price in EUR per tonne of CO2.
      type: number
    - name: minimum_bid_eur_per_tco2
      title: Minimum Bid (EUR/tCO2)
      description: Lowest bid price in EUR per tonne of CO2.
      type: number
    - name: number_of_bids_submitted
      title: Number of Bids Submitted
      description: Total number of bids submitted.
      type: integer
    - name: number_of_successful_bidders
      title: Number of Successful Bidders
      description: Number of bidders that won allowances.
      type: integer
    - name: number_of_successful_bids
      title: Number of Successful Bids
      description: Number of bids that were successful.
      type: integer
    - name: revenue_at_eur
      title: Revenue Austria (EUR)
      description: Auction revenue allocated to Austria.
      type: number
    - name: revenue_be_eur
      title: Revenue Belgium (EUR)
      description: Auction revenue allocated to Belgium.
      type: number
    - name: revenue_bg_eur
      title: Revenue Bulgaria (EUR)
      description: Auction revenue allocated to Bulgaria.
      type: number
    - name: revenue_cy_eur
