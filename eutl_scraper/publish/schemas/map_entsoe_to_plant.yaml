name: map_entsoe_to_plant
title: Mapping of ENTSOE units to power plants
description: >-
  Mapping of ENTSOE units to power plants. The mapping established a link
  between the ENTSOE units and the power plants in the ENTSOE-Power Plants.
  Since it is a many-to-many mapping, the mapping is established via a plant
  table that contains the unique plant identifiers and the fuel type of the plant.

  Note that the primary key of this table is:
    - eic_g
    - eic_p
    - plant_id

  But this is not enforced in the schema as we might have missing eic_p identifiers.
sources:
  - title: Abrell, J, Kosch, M., and Stimpfle, L. (2025), Linking EU ETS installations to ENTSOE-Power Plants and IEP Facilities
    # path: https://union-registry-data.ec.europa.eu/report/welcome

schema:
  foreignKeys:
    - fields:
        - plant_id
      reference:
        resource: powerplants
        fields:
          - plant_id
  fields:
    - name: eic_g
      title: ENTSOE Generation Unit ID
      description: Unique identifier for the ENTSOE generation unit.
      type: string
      constraints:
        required: true
    - name: name_g
      title: ENTSOE Generation Unit Name
      description: Name of the ENTSOE generation unit.
      type: string
    - name: eic_p
      title: ENTSOE Production Unit ID
      description: Unique identifier for the ENTSOE production unit.
      type: string
    - name: name_p
      title: ENTSOE Production Unit Name
      description: Name of the ENTSOE production unit.
      type: string
    - name: plant_id
      title: Plant ID
      description: Unique identifier for the power plant. Starts with the 2-digit country code followed by the plant name
      type: string
      constraints:
        required: true