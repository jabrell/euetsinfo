name: installations
title: EU ETS Installations
description: >-
  Information about the installations that are part of the European Union
  Emissions Trading System (EU ETS, ets_id "euets") and about the regulated
  entities of the ETS2 for buildings, road transport and additional sectors
  (ets_id "ets2", activity type code 70).
sources:
  - title: European Commission, EUTL database
    path: https://union-registry-data.ec.europa.eu/report/welcome

schema:
  primaryKey: id
  missingValues:
    - ""
    - "NA"
  fields:
    - name: id
      title: Installation ID
      description: Unique identifier for the installation.
      type: string
      constraints:
        required: true
    - name: name
      title: Installation Name
      description: Name of the installation.
      type: string
    - name: permitID
      title: Permit Identifier
      description: Identifier of the installation permit.
      type: string
    - name: eperID
      title: EPER Identification
      description: European Pollutant Emission Register identification.
      type: string
    - name: ets_id
      title: ETS ID
      description: >-
        Emissions trading system the installation belongs to: "euets" for the
        EU ETS, "ets2" for ETS2 regulated entities.
      type: string
      constraints:
        required: true
        enum:
          - euets
          - ets2
    - name: registry_id
      title: Registry ID
      description: Identifier of the national registry.
      type: string
      constraints:
        required: true
    - name: registry_name
      title: Registry Name
      description: Name of the national registry.
      type: string
      constraints:
        required: true
    - name: activity_id
      title: Activity Type Code
      description: Numeric code of the installation activity type.
      type: integer
    - name: activity_name
      title: Activity Type
      description: Name of the installation activity type.
      type: string
    - name: permit_revocation_date
      title: Permit Revocation Date
      description: Date the permit was revoked, if applicable.
      type: datetime
    - name: city
      title: City
      description: City where the installation is located.
      type: string
    - name: postal_code
      title: Postal Code
      description: Postal code of the installation location.
      type: string
    - name: address_main
      title: Address Line 1
      description: Primary address of the installation.
      type: string
    - name: address_secondary
      title: Address Line 2
      description: Secondary address of the installation.
      type: string
    - name: year_of_first_emissions
      title: Year of First Emissions
      description: First year emissions were reported.
      type: integer
    - name: year_of_last_emissions
      title: Year of Last Emissions
      description: Last year emissions were reported, if applicable.
      type: integer
    - name: snapshot_date
      title: Snapshot Date
      description: Date of the data snapshot as provided by the EUTL.
      type: datetime
    - name: created_at
      title: Date when the data was created
      description: Date when data have been downloaded and processed
      type: datetime
      constraints:
        required: true
