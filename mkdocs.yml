site_name: EUTL Scraper v2
site_description: Documentation for EUTL Scraper v2
site_author: jabrell
repo_url: https://github.com/jabrell/eutl_scraper_v2
repo_name: jabrell/eutl_scraper_v2

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home:
    - Overview: index.md
    - Contributing: home/contributing.md
  # - Data Processing:
  #   - Overview: data_processing.md
  #   - Accounts and Account Holders: account_processing.md
  #   - Carbon prices: carbon_price_data_collecting.md
  - Data:
    - Overview: data/index.md
    - Background: data/background.md
    - Data model: data/data_model.md
  - Architecture:
    - Overview: architecture/index.md
    - Settings and paths: architecture/settings.md
    - Publishing: architecture/publishing.md
    - Onboarding new data: architecture/onboarding.md
  - API Reference:
    - Core abstractions: api/pipeline.md
    - Top-level bundles: api/bundles.md
    - EUTL pipelines: api/eutl.md
    - Auxiliary pipelines: api/other.md
    - Settings: api/settings.md
    - Publishing: api/publish.md
