site_name: EUETS.INFO
site_description: Documentation for EUETS data processing
site_author: jabrell
site_url: https://jabrell.github.io/euetsinfo/
repo_url: https://github.com/jabrell/euetsinfo
repo_name: jabrell/euetsinfo

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_data_model.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home:
    - Overview: index.md
    - Contributing: home/contributing.md
  # - Data Processing:
  #   - Overview: data_processing.md
  #   - Accounts and Account Holders: account_processing.md
  #   - Carbon prices: carbon_price_data_collecting.md
  - Background:
    - EU ETS: background/index.md
  - Data:
    - Overview: data/index.md
    - Data Model:
      - Data Model: data/data_model.md
      - Tables: data/tables/
  - Technical Approach:
    - Architecture:
      - Overview: technical_approach/architecture/index.md
      - Settings and paths: technical_approach/architecture/settings.md
      - Publishing: technical_approach/architecture/publishing.md
      - Onboarding new data: technical_approach/architecture/onboarding.md
    - API Reference:
      - Core abstractions: technical_approach/api/pipeline.md
      - Top-level bundles: technical_approach/api/bundles.md
      - EUTL pipelines: technical_approach/api/eutl.md
      - Auxiliary pipelines: technical_approach/api/other.md
      - Settings: technical_approach/api/settings.md
      - Publishing: technical_approach/api/publish.md
